<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <img
        src="https://www.shutterstock.com/image-vector/vector-cat-face-minimalist-adorable-600nw-2426797721.jpg"
        alt="cat logo"
        width="50"
        height="auto"
      />
      <h1>Week 1 Assignment</h1>
      <nav>
        <a href="#top">To Top</a>
        <a href="#mainecoon">To Mainecoon</a>
        <a href="#savannah">To Savannah</a>
        <a href="#lynx">To Lynx</a>
      </nav>
    </header>
    <main>
      <div class="grope" id="mainecoon">
        <img
          src="https://media.istockphoto.com/id/2185926459/photo/main-coon-cat-walking-in-the-garden.jpg?s=612x612&w=0&k=20&c=1GmBOL_rXEXo0AomrpvZuKsD8ibS3MXS-GhRmslfpI0="
          alt="mainecoon cat img"
          class="img-cat"
        />
        <div class="text-box">
          <h2>Mainecoon Cat</h2>
          <p>Mainecoon cats are one of the biges domestic cats you can own.</p>
          <button
            onclick="document.location='https://en.wikipedia.org/wiki/Maine_Coon'"
          >
            More Info
          </button>
        </div>
      </div>
      <div class="grope" id="savannah">
        <img
          src="https://cats.com/wp-content/uploads/2022/02/Alert-serval-cat-compressed.jpg"
          alt="savannah cat img"
          class="img-cat"
        />
        <div class="text-box">
          <h2>Savannah Cat</h2>
          <p>Savannah cats are more known for their spots.</p>
          <button
            onclick="document.location='https://en.wikipedia.org/wiki/Savannah_cat'"
          >
            More Info
          </button>
        </div>
      </div>
      <div class="grope" id="lynx">
        <img
          src="https://images.squarespace-cdn.com/content/v1/5d18f529d7d4e0000189417b/1615698080635-2OJGPYQM6V6Y68C9IRDD/eurasian-lynx.jpg"
          alt="lynx cat img"
          class="img-cat"
        />
        <div class="text-box">
          <h2>Lynx Cat</h2>
          <p>Lynx cats are more known for the tufts on their ears.</p>
          <button
            onclick="document.location='https://en.wikipedia.org/wiki/Lynx'"
          >
            More Info
          </button>
        </div>
      </div>
    </main>
    <footer>
      <h3>Made by Luke Plechaty</h3>
      <img
        src="https://cdn4.iconfinder.com/data/icons/various-icons-2/476/Facebook.png"
        alt="FB img"
        onclick="document.location='https://www.facebook.com/lukeplechaty'"
        width="20"
        height="auto"
      />
      <img
        src="https://cdn-icons-png.flaticon.com/256/145/145812.png"
        alt="X img"
        onclick="document.location='https://x.com/lukeplechaty'"
        width="20"
        height="auto"
      />
      <img
        src="https://cdn3.iconfinder.com/data/icons/social-network-30/512/social-06-512.png"
        alt="YT img"
        onclick="document.location='https://www.youtube.com/lukeplechaty'"
        width="20"
        height="auto"
      />
    </footer>
  </body>
</html>
